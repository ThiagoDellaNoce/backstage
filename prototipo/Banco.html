<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa do banco Backstage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de trabalho da produção — direta, calma, sem enfeite
   IDEA: a planta técnica de um evento — setores numa prancha escura, ligados por cabos
   PICTURE: o próprio mapa do banco: 47 cartões arrastáveis em grupos coloridos, cabos entre eles
   COLOUR and TYPE: dark do Backstage (var(--x15101c), roxo var(--x6b3e92), laranja var(--xf1613a), texto var(--xf3f3f3)); Manrope + JetBrains Mono nas colunas
   LAYOUT: barra fina no topo, prancha em tela cheia, painel de detalhe à direita (folha embaixo no celular) */
:root{color-scheme:dark;--bg:var(--x15101c);--bg2:var(--x1d1726);--card:var(--x221b2d);--line:var(--x3a3046);--ink:var(--xf3f3f3);--mute:var(--xa99fb6);--p:var(--x6b3e92);--s:var(--xf1613a);--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{background:var(--bg2);border:1px solid var(--line);border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer}
button:hover{border-color:var(--x5a4b6b)}button:focus-visible,input:focus-visible{outline:2px solid var(--s);outline-offset:2px}
button[aria-pressed=true]{background:var(--p);border-color:var(--p);color:var(--on-p)}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg);z-index:5}
h1{font-size:18px;line-height:1.1;margin:0;font-weight:800;white-space:nowrap}h1 span{color:var(--s)}
.stats{color:var(--mute);font-size:13px;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
#q{background:var(--bg2);border:1px solid var(--line);border-radius:8px;min-height:36px;padding:0 12px;width:220px;font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0}
.legend{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border-radius:99px;min-height:32px;font-size:13px;padding:0 12px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--g)}
main{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;inset:0;cursor:grab;touch-action:none;background:radial-gradient(circle,var(--x2a2234) 1px,transparent 1.2px) 0 0/24px 24px}
#stage.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-width:1.6;opacity:.38;transition:opacity .2s}
#edges path.v{stroke-dasharray:5 5}
#edges path.hot{opacity:1;stroke-width:2.4}#edges path.dim{opacity:.05}
.glabel{position:absolute;font-weight:800;font-size:15px;color:var(--g);white-space:nowrap}
.card{position:absolute;width:244px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px #0006;transition:opacity .2s,border-color .2s;user-select:none}
.card.v{border-style:dashed;background:var(--x1d1825)}
.card .hd{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);cursor:move;border-radius:10px 10px 0 0;background:linear-gradient(90deg,color-mix(in srgb,var(--g) 22%,transparent),transparent)}
.card .hd b{font:600 13px var(--mono);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .hd span{font-size:12px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g);flex:none}
.card ul{list-style:none;margin:0;padding:4px 0}
.card li{display:flex;gap:6px;align-items:center;padding:2px 11px;font:12px/1.6 var(--mono)}
.card li .k{width:22px;flex:none;font-size:10px;font-weight:700;color:var(--mute)}
.card li .k.pk{color:var(--xe8b14f)}.card li .k.fk{color:var(--g)}.card li .k.f{color:var(--x4fc2b0)}
.card li .cn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card li .ty{color:var(--mute);font-size:11px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.card li.hit{background:color-mix(in srgb,var(--s) 25%,transparent)}
.card .vd{margin:0;padding:8px 11px 2px;font-size:12px;line-height:1.45;color:var(--mute)}
.card .more{font-size:12px;color:var(--mute);padding:0 11px 7px}
.card.sel{border-color:var(--s);box-shadow:0 0 0 2px var(--s),0 10px 30px #000a}
.card.hot{border-color:var(--g)}.card.dim{opacity:.16}
.zoom{position:absolute;left:16px;bottom:16px;display:flex;gap:6px;z-index:3}.zoom button{min-width:40px;min-height:40px;background:var(--bg2)}
aside{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg2);border-left:1px solid var(--line);overflow:auto;transform:translateX(102%);transition:transform .25s;z-index:4;padding:18px 20px 40px}
aside.open{transform:none}
aside h2{font:700 20px var(--mono);margin:6px 0 4px;overflow-wrap:anywhere}
aside h3{font-size:13px;color:var(--mute);font-weight:700;margin:22px 0 8px}
aside .x{position:sticky;top:0;float:right;min-width:40px;min-height:40px}
.gtag{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--g)}
.desc{font-size:15px;margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
td.cn{font:500 12.5px var(--mono)}td.cn>i{font-style:normal;white-space:nowrap}td.ty{font:12px var(--mono);color:var(--mute);text-align:right}
.b{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;margin:2px 4px 0 0;background:#ffffff14;color:var(--mute)}
.b.pk{color:var(--xe8b14f)}.b.f{color:var(--x4fc2b0)}.b.r{color:var(--xff8f6b)}
.sub{display:block;color:var(--mute);font-size:12.5px;margin-top:3px;font-family:Manrope,sans-serif;white-space:normal}
.f{font:12px/1.5 var(--mono);color:var(--x9fe3d7);white-space:normal;overflow-wrap:anywhere;display:block;margin-top:3px}
a.lnk{color:var(--ink);text-decoration:underline;text-decoration-color:var(--s);cursor:pointer;font-family:var(--mono);font-size:12.5px}
.links{display:flex;flex-wrap:wrap;gap:6px}.links a{border:1px solid var(--line);border-radius:99px;padding:3px 10px;text-decoration:none}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:4px 0}
pre{background:var(--x120e17);border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.55 var(--mono);overflow-x:auto;white-space:pre;color:var(--xd9d2e3)}
.flow{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(620px,calc(100% - 32px));background:var(--bg2);border:1px solid var(--s);border-radius:12px;padding:14px 16px;z-index:3;box-shadow:0 12px 40px #000b;display:none}
.flow.open{display:block}
.flow .top{display:flex;align-items:center;gap:10px}.flow .top b{flex:1}.flow .top span{color:var(--mute);font-size:13px;white-space:nowrap}
.flow p{margin:8px 0 12px}.flow .nav{display:flex;gap:8px}
#flows{position:absolute;right:16px;top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;z-index:6;display:none;width:280px;box-shadow:0 12px 40px #000b}
#flows.open{display:block}#flows button{display:block;width:100%;text-align:left;border:0;background:none;min-height:40px}#flows button:hover{background:#ffffff0d}
.hint{position:absolute;right:16px;bottom:80px;color:var(--mute);font-size:12.5px;z-index:2;max-width:300px;text-align:right}
@media(max-width:700px){#q{width:100%}.tools{margin-left:0;width:100%}.stats{display:none}aside{top:auto;height:62%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(102%)}.hint{display:none}.flow{bottom:72px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

:null,"en":null,"note":null},{"n":"frequencia","ty":"numeric","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"status_contrato","ty":"status_etapa","nul":true,"df":null,"gen":null,"en":"status_etapa","note":null},{"n":"status_producao","ty":"status_etapa","nul":true,"df":null,"gen":null,"en":"status_etapa","note":null},{"n":"pagamento_ref_externa","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"ordem","ty":"integer","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"arquivado","ty":"boolean","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"criado_em","ty":"timestamptz","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"atualizado_em","ty":"timestamptz","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"item_nome","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"categoria_id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"categoria_nome","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"categoria_ordem","ty":"integer","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"quantidade_final","ty":"numeric","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"valor_total","ty":"numeric(14,2)","nul":true,"df":null,"gen":null,"en":null,"note":null}],"chk":[],"uq":[],"fk":[{"c":[],"t":"catalogo_itens","view":1},{"c":[],"t":"categorias","view":1},{"c":[],"t":"planilha_itens","view":1},{"c":[],"t":"v_memoria_resultado","view":1}],"trg":[],"pol":[],"sql":"-- A planilha como a tela mostra: quantidade e valor finais\n--  • memória com R$  → valor vem da memória\n--  • memória sem R$  → quantidade vem da memória, valor = qtd × freq × unitário\n--  • sem memória     → tudo digitado\nCREATE VIEW v_planilha WITH (security_invoker = true) AS\nSELECT\n  pi.*,\n  c.nome  AS item_nome,\n  cat.id  AS categoria_id,\n  cat.nome AS categoria_nome,\n  cat.ordem AS categoria_ordem,\n  coalesce(mr.quantidade, pi.quantidade) AS quantidade_final,\n  coalesce(mr.valor,\n           coalesce(mr.quantidade, pi.quantidade) * pi.frequencia * pi.valor_unitario)::NUMERIC(14,2) AS valor_total\nFROM planilha_itens pi\nJOIN catalogo_itens c ON c.id = pi.catalogo_item_id\nJOIN categorias cat   ON cat.id = c.categoria_id\nLEFT JOIN v_memoria_resultado mr ON mr.planilha_item_id = pi.id\nWHERE NOT pi.arquivado;"},"v_memoria_resultado":{"n":"v_memoria_resultado","g":"visoes","d":"Soma de cada memória de cálculo por item da planilha.","v":true,"cols":[{"n":"planilha_item_id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"quantidade","ty":"numeric","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"valor","ty":"numeric","nul":true,"df":null,"gen":null,"en":null,"note":null}],"chk":[],"uq":[],"fk":[{"c":[],"t":"mem_banheiro","view":1},{"c":[],"t":"mem_barricada","view":1},{"c":[],"t":"mem_cenografia","view":1},{"c":[],"t":"mem_com_visual","view":1},{"c":[],"t":"mem_forracao","view":1},{"c":[],"t":"mem_gradil_tenda","view":1},{"c":[],"t":"mem_mesas_cadeiras","view":1},{"c":[],"t":"mem_mobilia","view":1},{"c":[],"t":"mem_painel_led","view":1},{"c":[],"t":"mem_piso_fechamento","view":1}],"trg":[],"pol":[],"sql":"-- Resultado de cada memória por item da planilha (quantidade e valor).\n-- Nas memórias com R$, o que manda é o valor; a quantidade é só referência.\nCREATE VIEW v_memoria_resultado WITH (security_invoker = true) AS\nSELECT planilha_item_id, sum(m2) AS quantidade, sum(valor_total) AS valor FROM mem_com_visual GROUP BY 1\nUNION ALL SELECT planilha_item_id, sum(m2), sum(total) FROM mem_forracao GROUP BY 1\nUNION ALL SELECT planilha_item_id, sum(quantidade), sum(total) FROM mem_cenografia GROUP BY 1\nUNION ALL SELECT planilha_item_id, sum(area_m2), sum(valor) FROM mem_piso_fechamento GROUP BY 1          -- qtd = área (fechamento em ML fica na tela)\nUNION ALL SELECT planilha_item_id, sum(tendas_m2), sum(valor_total) FROM mem_gradil_tenda GROUP BY 1       -- qtd = m² de tenda\nUNION ALL SELECT planilha_item_id, sum(total), NULL FROM mem_banheiro GROUP BY 1\nUNION ALL SELECT planilha_item_id, sum(quantidade), NULL FROM mem_barricada GROUP BY 1\nUNION ALL SELECT planilha_item_id, sum(metros_totais), NULL FROM mem_painel_led GROUP BY 1\nUNION ALL SELECT planilha_item_id, sum(mesas + cadeiras), NULL FROM mem_mesas_cadeiras GROUP BY 1\nUNION ALL SELECT planilha_item_id, sum(quantidade), NULL FROM mem_mobilia GROUP BY 1;"},"v_evento_dimensionamento":{"n":"v_evento_dimensionamento","g":"visoes","d":"Quanto o público pede de baias, banheiros, seguranças e bar.","v":true,"cols":[{"n":"evento_id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"codigo","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"nome","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"unidade","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"pessoas_por_unidade","ty":"numeric","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"ordem","ty":"integer","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"necessario","ty":"integer","nul":true,"df":null,"gen":null,"en":null,"note":null}],"chk":[],"uq":[],"fk":[{"c":[],"t":"eventos","view":1},{"c":[],"t":"parametros_dimensionamento","view":1}],"trg":[],"pol":[],"sql":"-- ---------------------------------------------------------------------\n-- 16. VISÕES PARA AS TELAS\n-- ---------------------------------------------------------------------\n-- Dimensionamento pelo público (Visão geral): sempre arredonda para cima\nCREATE VIEW v_evento_dimensionamento WITH (security_invoker = true) AS\nSELECT e.id AS evento_id, p.codigo, p.nome, p.unidade, p.pessoas_por_unidade, p.ordem,\n       ceil(e.publico_estimado / p.pessoas_por_unidade)::INT AS necessario\nFROM eventos e\nJOIN parametros_dimensionamento p ON p.empresa_id = e.empresa_id\nWHERE e.publico_estimado IS NOT NULL;"},"v_cronograma":{"n":"v_cronograma","g":"visoes","d":"A grade do cronograma com a data real de cada marcação.","v":true,"cols":[{"n":"evento_id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"setor_id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"setor","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"setor_ordem","ty":"integer","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"linha_id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"linha_pai_id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"linha_ordem","ty":"integer","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"titulo","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"planilha_item_id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"dia_relativo","ty":"integer","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"data","ty":"date","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"periodo","ty":"periodo_dia","nul":true,"df":null,"gen":null,"en":"periodo_dia","note":null},{"n":"fase","ty":"fase_cronograma","nul":true,"df":null,"gen":null,"en":"fase_cronograma","note":null}],"chk":[],"uq":[],"fk":[{"c":[],"t":"catalogo_itens","view":1},{"c":[],"t":"cronograma_linhas","view":1},{"c":[],"t":"cronograma_marcacoes","view":1},{"c":[],"t":"eventos","view":1},{"c":[],"t":"planilha_itens","view":1},{"c":[],"t":"setores","view":1}],"trg":[],"pol":[],"sql":"-- Grade do cronograma com a data real de cada marcação\nCREATE VIEW v_cronograma WITH (security_invoker = true) AS\nSELECT l.evento_id, s.id AS setor_id, s.nome AS setor, s.ordem AS setor_ordem,\n       l.id AS linha_id, l.linha_pai_id, l.ordem AS linha_ordem,\n       coalesce(l.titulo, c.nome) AS titulo, l.planilha_item_id,\n       m.dia_relativo, (e.data_evento + m.dia_relativo) AS data, m.periodo, m.fase\nFROM cronograma_linhas l\nJOIN setores s ON s.id = l.setor_id\nJOIN eventos e ON e.id = l.evento_id\nLEFT JOIN planilha_itens pi ON pi.id = l.planilha_item_id\nLEFT JOIN catalogo_itens c  ON c.id = pi.catalogo_item_id\nLEFT JOIN cronograma_marcacoes m ON m.linha_id = l.id;"},"v_cronograma_marcos":{"n":"v_cronograma_marcos","g":"visoes","d":"Marcos do topo do cronograma: prazos de documentos, passagem de som, show.","v":true,"cols":[{"n":"evento_id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"tipo","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"titulo","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"dia_relativo","ty":"integer","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"horario","ty":"timestamptz","nul":true,"df":null,"gen":null,"en":null,"note":null}],"chk":[],"uq":[],"fk":[{"c":[],"t":"atracoes","view":1},{"c":[],"t":"documentos","view":1},{"c":[],"t":"eventos","view":1},{"c":[],"t":"tipos_documento","view":1}],"trg":[],"pol":[],"sql":"-- Marcos que aparecem no topo do cronograma (só leitura)\nCREATE VIEW v_cronograma_marcos WITH (security_invoker = true) AS\nSELECT d.evento_id, 'documento' AS tipo, t.nome AS titulo, d.prazo_dia_relativo AS dia_relativo, NULL::TIMESTAMPTZ AS horario\nFROM documentos d JOIN tipos_documento t ON t.id = d.tipo_id\nWHERE d.prazo_dia_relativo IS NOT NULL\nUNION ALL\nSELECT a.evento_id, 'passagem_som', a.nome, (a.passagem_som_em::DATE - e.data_evento), a.passagem_som_em\nFROM atracoes a JOIN eventos e ON e.id = a.evento_id WHERE a.passagem_som_em IS NOT NULL\nUNION ALL\nSELECT a.evento_id, 'show', a.nome, (a.show_em::DATE - e.data_evento), a.show_em\nFROM atracoes a JOIN eventos e ON e.id = a.evento_id WHERE a.show_em IS NOT NULL;"},"v_estoque_saldo":{"n":"v_estoque_saldo","g":"visoes","d":"Saldo do estoque: reservado, em evento, em manutenção, perdido.","v":true,"cols":[{"n":"id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"empresa_id","ty":"bigint","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"nome","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"unidade","ty":"text","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"qtd_total","ty":"numeric","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"reservado","ty":"numeric","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"em_evento","ty":"numeric","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"em_manutencao","ty":"numeric","nul":true,"df":null,"gen":null,"en":null,"note":null},{"n":"perdido","ty":"numeric","nul":true,"df":null,"gen":null,"en":null,"note":null}],"chk":[],"uq":[],"fk":[{"c":[],"t":"estoque_itens","view":1},{"c":[],"t":"estoque_movimentos","view":1}],"trg":[],"pol":[],"sql":"-- Saldo de estoque por situação\nCREATE VIEW v_estoque_saldo WITH (security_invoker = true) AS\nSELECT i.id, i.empresa_id, i.nome, i.unidade, i.qtd_total,\n       coalesce(sum(m.quantidade) FILTER (WHERE m.tipo = 'reserva'), 0)  AS reservado,\n       coalesce(sum(m.quantidade) FILTER (WHERE m.tipo = 'saida'), 0)\n     - coalesce(sum(m.quantidade) FILTER (WHERE m.tipo = 'retorno'), 0) AS em_evento,\n       coalesce(sum(m.quantidade) FILTER (WHERE m.tipo = 'manutencao'), 0)\n     - coalesce(sum(m.quantidade) FILTER (WHERE m.tipo = 'retorno_manutencao'), 0) AS em_manutencao,\n       coalesce(sum(m.quantidade) FILTER (WHERE m.tipo = 'perda'), 0)    AS perdido\nFROM estoque_itens i LEFT JOIN estoque_movimentos m ON m.estoque_item_id = i.id\nGROUP BY i.id;"}},"enums":{"estilo_gradil_tenda":["tubular","balcao","gradil","lona","calhada","arco","avance"],"fase_cronograma":["montagem","operacao","desmontagem"],"item_gradil_tenda":["tenda","balcao","gradil","fechamento_lona"],"item_piso":["piso","escada","arquibancada","fechamento","rampa"],"material_mesa":["madeira","plastico"],"papel_usuario":["gestor","planejamento","arquiteto","produtor_bar","produtor_palco","produtor_geral","freelance"],"peca_barricada":["reta","curva_direita","curva_esquerda"],"periodo_dia":["manha","tarde","noite"],"status_conferencia":["a_conferir","conforme","divergente"],"status_documento":["pendente","protocolado","em_analise","aprovado","indeferido"],"status_etapa":["pendente","em_andamento","concluido","cancelado"],"status_evento":["planejamento","montagem","operacao","desmontagem","encerrado","cancelado"],"tipo_atracao":["artistico","staff","fornecedor","esportivo"],"tipo_memoria":["nenhuma","com_visual","forracao","cenografia","piso_fechamento","gradil_tenda","banheiro","barricada","painel_led","mesas_cadeiras","mobilia"],"tipo_veiculo":["carro","van","onibus","aviao"],"trecho_transporte":["chegada_cidade","ida_passagem_som","volta_passagem_som","ida_show","volta_show","saida_cidade"]},"flows":[{"t":"Do catálogo ao valor da planilha","steps":[{"x":"Ao adicionar um item na planilha, ele vem do catálogo. Um gatilho copia de lá o tipo de memória de cálculo e a unidade.","tb":["catalogo_itens","categorias","planilha_itens"]},{"x":"As linhas de cada memória pertencem a um item da planilha do mesmo tipo. A ligação tripla (item, evento, tipo) impede lançar piso num item de gradil.","tb":["planilha_itens","mem_piso_fechamento","mem_gradil_tenda","mem_com_visual","mem_forracao","mem_cenografia","mem_banheiro","mem_barricada","mem_painel_led","mem_mesas_cadeiras","mem_mobilia"]},{"x":"Medidas e valores das memórias são calculados pelo banco (ex.: lonas m² = qtd × largura × 2,70). Cada memória soma seus resultados por item.","tb":["v_memoria_resultado","mem_piso_fechamento","mem_gradil_tenda","mem_com_visual","mem_forracao","mem_cenografia","mem_banheiro","mem_barricada","mem_painel_led","mem_mesas_cadeiras","mem_mobilia"]},{"x":"A planilha final usa o valor da memória quando ela tem R$; senão, quantidade × frequência × valor unitário.","tb":["v_planilha","v_memoria_resultado","planilha_itens","catalogo_itens","categorias"]}]},{"t":"Criar um evento","steps":[{"x":"Gestor ou planejamento cria o evento, opcionalmente a partir de um modelo pronto.","tb":["eventos","modelos_evento","modelo_modulos"]},{"x":"Um gatilho liga as telas fixas (Visão geral e Planilha), cria os documentos padrão e põe quem criou na equipe.","tb":["eventos","evento_modulos","modulos","documentos","tipos_documento","evento_equipe"]},{"x":"O app grava as respostas do checklist em evento_modulos. Desligar uma tela só esconde; nada é apagado.","tb":["evento_modulos","modulos"]},{"x":"O público estimado alimenta o dimensionamento mostrado na Visão geral.","tb":["eventos","parametros_dimensionamento","v_evento_dimensionamento"]}]},{"t":"Montar o cronograma","steps":[{"x":"Os setores do evento organizam a grade e podem ser reordenados.","tb":["setores","eventos"]},{"x":"Cada linha é uma estrutura da planilha num setor. Itens de categorias fora do cronograma (Staff) são recusados.","tb":["cronograma_linhas","setores","planilha_itens","categorias"]},{"x":"As marcações guardam dia relativo ao dia 0, período (manhã, tarde, noite) e fase (montagem, operação, desmontagem).","tb":["cronograma_marcacoes","cronograma_linhas"]},{"x":"As visões convertem D-x em data real e trazem os marcos: prazos de documentos, passagem de som e show.","tb":["v_cronograma","v_cronograma_marcos","cronograma_marcacoes","documentos","atracoes"]}]},{"t":"Quem vê o quê","steps":[{"x":"Cada usuário tem um papel. Gestor e planejamento veem todos os eventos da empresa.","tb":["usuarios","empresas"]},{"x":"Os demais veem só os eventos em que estão na equipe. A regra vale para todas as tabelas do evento.","tb":["evento_equipe","eventos","usuarios","planilha_itens","documentos","atracoes","setores"]},{"x":"Ligar e desligar telas do checklist: só gestor e planejamento. Integrações: só o próprio usuário.","tb":["evento_modulos","usuario_integracoes"]}]},{"t":"Artístico","steps":[{"x":"Cada atração tem custos, hospedagens e transportes.","tb":["atracoes","atracao_custos","hospedagens","transportes"]},{"x":"A hospedagem aponta para o hotel e abre no roomlist; transportes podem ter fornecedor.","tb":["hospedagens","hoteis","roomlist","transportes","fornecedores"]}]}]};
{

const T=DB.tables, G={};DB.groups.forEach(g=>G[g.id]=g);

const st={all:false,views:true,sup:false,sel:null,focus:null,q:'',k:1,tx:40,ty:30};

for(const t of Object.values(T))for(const f of t.fk)if(T[f.t])E.push({s:t.n,t:f.t,c:f.c[0],v:!!f.view});

$('#stats').textContent=`${nT} tabelas · ${nV} visões · ${Object.keys(DB.enums).length} listas fixas · ${E.filter(e=>!e.v).length} ligações`;

$('#legend').innerHTML=DB.groups.map(g=>`<button class="chip" data-g="${g.id}" style="--g:${g.c}" aria-pressed="false"><i></i>${esc(g.n)}</button>`).join('');

function rows(t){
  return t.cols.filter(c=>st.all||c.pk||c.fk).map(c=>{
    const k=c.pk?'<span class="k pk">PK</span>':c.fk?'<span class="k fk">FK</span>':c.gen?'<span class="k f">ƒ</span>':'<span class="k"></span>';
    return `<li data-c="${esc(c.n)}">${k}<span class="cn">${esc(c.n)}</span><span class="ty">${esc(c.ty)}</span></li>`}).join('');
}
function cardHTML(t){
  const g=G[t.g],shown=t.cols.filter(c=>st.all||c.pk||c.fk).length,rest=t.cols.length-shown;
  return `<div class="hd"><span class="dot"></span><b>${esc(t.n)}</b><span>${t.cols.length}</span></div>${t.v&&!st.all?`<p class="vd">${esc(t.d)}</p>`:''}<ul>${rows(t)}</ul>${rest?`<div class="more">+ ${rest} colunas</div>`:''}`;
}
const cards={};
for(const t of Object.values(T)){
  const d=document.createElement('div');d.className='card'+(t.v?' v':'');d.id='c-'+t.n;d.style.setProperty('--g',G[t.g].c);
  d.dataset.n=t.n;world.appendChild(d);cards[t.n]=d;
}
const labels={};
for(const g of DB.groups){const l=document.createElement('div');l.className='glabel';l.style.setProperty('--g',g.c);l.textContent=g.n;world.appendChild(l);labels[g.id]=l}

function render(){for(const t of Object.values(T))cards[t.n].innerHTML=cardHTML(t);layout();applyState()}

const CW=244,GAP=56,VG=18;
let home={};
function layout(){
  const colX=[];let x=0;const ncol=Math.max(...DB.groups.map(g=>g.col+g.span));
  const colW=Array(ncol).fill(CW);
  for(let i=0;i<ncol;i++){colX[i]=x;x+=colW[i]+GAP}
  const colY=Array(ncol).fill(0);home={};
  for(const g of DB.groups){
    const vis=g.id!=='visoes'||st.views;labels[g.id].style.display=vis?'':'none';
    let y=Math.max(...colY.slice(g.col,g.col+g.span));
    labels[g.id].style.left=colX[g.col]+'px';labels[g.id].style.top=y+'px';y+=30;
    const ys=Array(g.span).fill(y);
    g.t.forEach((n,i)=>{const c=cards[n];c.style.display=vis?'':'none';
      const sc=g.span>1?ys.indexOf(Math.min(...ys)):0;
      home[n]={x:colX[g.col+sc],y:ys[sc]};ys[sc]+=c.offsetHeight+VG});
    for(let i=0;i<g.span;i++)colY[g.col+i]=Math.max(...ys)+34;
  }
  for(const n in cards){const p=pos[n]||home[n];cards[n].style.left=p.x+'px';cards[n].style.top=p.y+'px'}
  drawEdges();
}
function box(n){const c=cards[n];return{x:c.offsetLeft,y:c.offsetTop,w:c.offsetWidth,h:c.offsetHeight}}
function rowY(n,col){const c=cards[n],li=col&&c.querySelector(`li[data-c="${CSS.escape(col)}"]`);return li?li.offsetTop+li.offsetHeight/2:19}
function visEdge(e){
  if(cards[e.s].style.display==='none'||cards[e.t].style.display==='none')return false;
  if(SUP.has(e.t)&&!st.sup&&!(st.sel===e.s||st.sel===e.t))return false;
  return true;
}
function drawEdges(){
  let h='';
  for(const [i,e] of E.entries()){
    if(!visEdge(e))continue;
    const a=box(e.s),b=box(e.t),y1=a.y+rowY(e.s,e.c),y2=b.y+19,col=G[T[e.s].g].c;let d;
    if(e.s===e.t){const x=a.x+a.w;d=`M${x} ${y1} C${x+50} ${y1} ${x+50} ${y2} ${x} ${y2}`}
    else{
      const ac=a.x+a.w/2,bc=b.x+b.w/2;
      if(Math.abs(ac-bc)<40){const x1=a.x+a.w,x2=b.x+b.w,o=60+Math.abs(y1-y2)*.08;d=`M${x1} ${y1} C${x1+o} ${y1} ${x2+o} ${y2} ${x2} ${y2}`}
      else{const r=bc>ac,x1=r?a.x+a.w:a.x,x2=r?b.x:b.x+b.w,dx=Math.max(40,Math.abs(x2-x1)/2)*(r?1:-1);d=`M${x1} ${y1} C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`}
    }
    h+=`<path data-i="${i}" class="${e.v?'v':''}" d="${d}" stroke="${col}" marker-end="url(#m${e.v?'v':''})"/>`;
  }
  svg.innerHTML=`<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9z" fill="#f3f3f3" opacity=".7"/></marker><marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9z" fill="#a7a0b3"/></marker></defs>`+h;
  applyEdgeState();
}

// destaque
let lit=null,litE=null;
function computeLit(){
  lit=null;litE=null;
  if(st.flow){const s=DB.flows[st.flow.f].steps[st.flow.i];lit=new Set(s.tb);litE=e=>lit.has(e.s)&&lit.has(e.t);return}
  if(st.sel){lit=nb(st.sel);lit.add(st.sel);litE=e=>e.s===st.sel||e.t===st.sel;return}
  if(st.focus){lit=new Set(G[st.focus].t);litE=e=>lit.has(e.s)||lit.has(e.t);return}
  if(st.q){const q=st.q.toLowerCase();lit=new Set(Object.values(T).filter(t=>t.n.includes(q)||t.cols.some(c=>c.n.includes(q))||t.d.toLowerCase().includes(q)).map(t=>t.n));litE=e=>lit.has(e.s)&&lit.has(e.t)}
}
function applyEdgeState(){for(const p of svg.querySelectorAll('path[data-i]')){const e=E[+p.dataset.i];p.classList.toggle('hot',!!litE&&litE(e));p.classList.toggle('dim',!!litE&&!litE(e))}}
function applyState(){
  computeLit();
  for(const n in cards){const c=cards[n];c.classList.toggle('sel',st.sel===n);c.classList.toggle('dim',!!lit&&!lit.has(n));c.classList.toggle('hot',!!lit&&lit.has(n)&&st.sel!==n);
    c.querySelectorAll('li').forEach(li=>li.classList.toggle('hit',!!st.q&&li.dataset.c.includes(st.q.toLowerCase())))}
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',st.focus===b.dataset.g));
  applyEdgeState();
}

// painel
function colRow(c){
  const b=[];if(c.pk)b.push('<span class="b pk">chave</span>');if(c.fk)b.push(`<span class="b">liga a <a class="lnk" data-go="${esc(c.fk)}">${esc(c.fk)}</a></span>`);
  if(!c.nul&&!c.pk&&!c.gen)b.push('<span class="b r">obrigatória</span>');if(c.ck)b.push(`<span class="b">${esc(c.ck)}</span>`);
  if(c.df&&!c.pk)b.push(`<span class="b">padrão: ${esc(c.df)}</span>`);
  const en=c.en&&DB.enums[c.en]?`<span class="sub">Opções: ${DB.enums[c.en].map(esc).join(' · ')}</span>`:'';
  return `<tr><td class="cn"><i>${esc(c.n)}</i>${c.note?`<span class="sub">${esc(c.note)}</span>`:''}${c.gen?`<span class="b f">calculada</span><span class="f">= ${esc(c.gen)}</span>`:''}${b.length?'<br>'+b.join(''):''}${en}</td><td class="ty">${esc(c.ty)}</td></tr>`;
}
function openPanel(n){
  const t=T[n],g=G[t.g];
  const out=E.filter(e=>e.s===n&&e.t!==n).map(e=>e.t),inc=E.filter(e=>e.t===n&&e.s!==n).map(e=>e.s);
  const L=a=>[...new Set(a)].map(x=>`<a class="lnk" data-go="${esc(x)}">${esc(x)}</a>`).join('');
  panel.innerHTML=`<button class="x" id="px" aria-label="Fechar">✕</button>
  <span class="gtag" style="--g:${g.c}"><span class="dot"></span>${esc(g.n)}${t.v?' · visão calculada':''}</span>
  <h2>${esc(t.n)}</h2><p class="desc">${esc(t.d)}</p>
  ${out.length?`<h3>${t.v?'Lê de':'Aponta para'}</h3><div class="links">${L(out)}</div>`:''}
  ${inc.length?`<h3>${t.v?'Usada por':'É usada por'}</h3><div class="links">${L(inc)}</div>`:''}
  <h3>Colunas (${t.cols.length})</h3><table><tbody>${t.cols.map(colRow).join('')}</tbody></table>
  ${t.uq.length?`<h3>Não pode repetir</h3><ul class="plain">${t.uq.map(u=>`<li><code>${u.map(esc).join(' + ')}</code></li>`).join('')}</ul>`:''}
  ${t.chk.length?`<h3>Regras de validação</h3><ul class="plain">${t.chk.map(c=>`<li><code>${esc(c)}</code></li>`).join('')}</ul>`:''}
  ${t.trg.length?`<h3>Automático</h3><ul class="plain">${t.trg.map(x=>`<li>${esc(x.x)} <span class="sub">${esc(x.q)}</span></li>`).join('')}</ul>`:''}
  ${t.pol.length?`<h3>Quem pode</h3><ul class="plain">${t.pol.map(p=>`<li><b>${esc(p.cmd)}</b>: ${esc(p.w)}</li>`).join('')}</ul>`:''}
  ${t.sql?`<h3>Como é calculada <button id="cp" style="min-height:30px;margin-left:8px">Copiar SQL</button></h3><pre>${esc(t.sql)}</pre>`:''}`;
  panel.classList.add('open');panel.scrollTop=0;
}
panel.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-go]');if(a){select(a.dataset.go,true);return}
  if(ev.target.id==='px'){select(null)}
  if(ev.target.id==='cp'){navigator.clipboard?.writeText(T[st.sel].sql).then(()=>ev.target.textContent='Copiado',()=>ev.target.textContent='Não deu para copiar')}
});
function select(n,center){
  st.sel=n;st.flow=null;$('#flow').classList.remove('open');
  if(n){if(T[n].v&&!st.views){st.views=true;$('#tViews').setAttribute('aria-pressed',true);layout()}openPanel(n);if(center)centerOn(n);else reveal(n)}else panel.classList.remove('open');
  drawEdges();applyState();
}

// pan / zoom / arrastar
function apply(){world.style.transform=`translate(${st.tx}px,${st.ty}px) scale(${st.k})`;stage.style.backgroundPosition=`${st.tx}px ${st.ty}px`;stage.style.backgroundSize=`${24*st.k}px ${24*st.k}px`}
function zoomAt(f,cx,cy){const k=Math.min(2,Math.max(.2,st.k*f));st.tx=cx-(cx-st.tx)*k/st.k;st.ty=cy-(cy-st.ty)*k/st.k;st.k=k;apply()}
function bounds(list){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const n of list){const c=cards[n];if(c.style.display==='none')continue;const b=box(n);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y-30);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)}return{x0,y0,x1,y1}}
function fit(list=Object.keys(cards),max=1){const r=stage.getBoundingClientRect(),b=bounds(list),pw=panel.classList.contains('open')&&r.width>700?440:0,fl=$('#flow'),ph=fl.classList.contains('open')?fl.offsetHeight+24:0;
  const W=r.width-pw-48,H=r.height-ph-48;const k=Math.min(max,W/(b.x1-b.x0),H/(b.y1-b.y0));st.k=Math.max(.2,k);st.tx=24+(W-(b.x1-b.x0)*st.k)/2-b.x0*st.k;st.ty=24+Math.max(0,(H-(b.y1-b.y0)*st.k)/2)-b.y0*st.k;apply()}
function reveal(n){const r=stage.getBoundingClientRect(),c=cards[n].getBoundingClientRect(),pr=panel.getBoundingClientRect();
  if(r.width>700){if(c.right>pr.left-16){st.tx-=c.right-pr.left+40;apply()}}else if(c.bottom>pr.top-8||c.top<r.top){st.ty+=(r.top+24)-c.top;apply()}}
function centerOn(n){const r=stage.getBoundingClientRect(),b=box(n),pw=r.width>700?440:0,k=Math.max(st.k,.8);st.k=k;st.tx=(r.width-pw)/2-(b.x+b.w/2)*k;st.ty=(r.width>700?r.height*.35:24)-(b.y)*k+(r.width>700?0:0);apply()}
stage.addEventListener('wheel',ev=>{ev.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(-ev.deltaY*.0015),ev.clientX-r.left,ev.clientY-r.top)},{passive:false});
let drag=null;
stage.addEventListener('pointerdown',ev=>{
  const card=ev.target.closest('.card');
  drag={id:ev.pointerId,x:ev.clientX,y:ev.clientY,moved:false,card:card&&ev.target.closest('.hd')?card:null,click:card,tx:st.tx,ty:st.ty};
  if(drag.card){drag.ox=drag.card.offsetLeft;drag.oy=drag.card.offsetTop}else if(!card)stage.classList.add('pan');
  stage.setPointerCapture(ev.pointerId);
});
stage.addEventListener('pointermove',ev=>{
  if(!drag||ev.pointerId!==drag.id)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(!drag.moved)return;
  if(drag.card){const n=drag.card.dataset.n;pos[n]={x:drag.ox+dx/st.k,y:drag.oy+dy/st.k};drag.card.style.left=pos[n].x+'px';drag.card.style.top=pos[n].y+'px';drawEdges()}
  else if(!drag.click){st.tx=drag.tx+dx;st.ty=drag.ty+dy;apply()}
});
stage.addEventListener('pointerup',ev=>{
  if(!drag)return;stage.classList.remove('pan');
  if(drag.moved&&drag.card){try{localStorage.setItem('bk-pos',JSON.stringify(pos))}catch(e){}}
  else if(!drag.moved){if(drag.click){const n=drag.click.dataset.n;select(st.sel===n?null:n)}else if(st.sel||st.flow)select(null)}
  drag=null;
});
$('#zIn').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2)};
$('#zOut').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(.8,r.width/2,r.height/2)};
$('#zFit').onclick=()=>fit();
$('#zReset').onclick=()=>{pos={};try{localStorage.removeItem('bk-pos')}catch(e){};layout();fit()};

// controles
function setMode(all){st.all=all;$('#mAll').setAttribute('aria-pressed',all);$('#mKeys').setAttribute('aria-pressed',!all);render()}
$('#mKeys').onclick=()=>setMode(false);$('#mAll').onclick=()=>setMode(true);
$('#tViews').onclick=e=>{st.views=!st.views;e.currentTarget.setAttribute('aria-pressed',st.views);if(!st.views&&st.sel&&T[st.sel].v)select(null);layout();applyState()};
$('#tSup').onclick=e=>{st.sup=!st.sup;e.currentTarget.setAttribute('aria-pressed',st.sup);drawEdges()};
$('#legend').addEventListener('click',ev=>{const b=ev.target.closest('.chip');if(!b)return;const g=b.dataset.g;st.focus=st.focus===g?null:g;st.sel=null;panel.classList.remove('open');
  if(g==='visoes'&&!st.views){st.views=true;$('#tViews').setAttribute('aria-pressed',true);layout()}drawEdges();applyState();if(st.focus)fit(G[g].t,1)});
$('#q').addEventListener('input',e=>{st.q=e.target.value.trim();st.focus=null;applyState()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&lit&&lit.size){const n=[...lit][0];select(n,true)}if(e.key==='Escape'){e.target.value='';st.q='';applyState()}});

// percursos
const fm=$('#flows');fm.innerHTML=DB.flows.map((f,i)=>`<button role="menuitem" data-f="${i}">${esc(f.t)}</button>`).join('');
$('#bFlows').onclick=e=>{const o=fm.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)};
fm.addEventListener('click',ev=>{const b=ev.target.closest('[data-f]');if(!b)return;fm.classList.remove('open');$('#bFlows').setAttribute('aria-expanded',false);showFlow(+b.dataset.f,0)});
function showFlow(f,i){
  st.sel=null;panel.classList.remove('open');st.flow={f,i};const F=DB.flows[f],s=F.steps[i];
  if(s.tb.some(n=>T[n].v)&&!st.views){st.views=true;$('#tViews').setAttribute('aria-pressed',true);layout()}
  const el=$('#flow');el.innerHTML=`<div class="top"><b>${esc(F.t)}</b><span>passo ${i+1} de ${F.steps.length}</span><button id="fx" aria-label="Fechar percurso">✕</button></div><p>${esc(s.x)}</p>
  <div class="nav"><button id="fp" ${i?'':'disabled'}>Anterior</button><button id="fn" ${i<F.steps.length-1?'':'disabled'}>Próximo</button><span style="flex:1"></span><span class="links">${s.tb.slice(0,4).map(n=>`<a class="lnk" data-go="${esc(n)}">${esc(n)}</a>`).join('')}</span></div>`;
  el.classList.add('open');drawEdges();applyState();fit(s.tb,1);
}
$('#flow').addEventListener('click',ev=>{const f=st.flow;if(!f)return;
  if(ev.target.id==='fx'){st.flow=null;$('#flow').classList.remove('open');drawEdges();applyState()}
  if(ev.target.id==='fp')showFlow(f.f,f.i-1);if(ev.target.id==='fn')showFlow(f.f,f.i+1);
  const a=ev.target.closest('[data-go]');if(a)select(a.dataset.go,true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement.id!=='q'){select(null);fm.classList.remove('open')}
  if(st.flow&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const F=DB.flows[st.flow.f],i=st.flow.i+(e.key==='ArrowRight'?1:-1);if(i>=0&&i<F.steps.length)showFlow(st.flow.f,i)}});
addEventListener('resize',()=>{});
render();fit();
if(location.hash.length>1&&T[location.hash.slice(1)])select(location.hash.slice(1),true);
}
</script>
<style>
#cmt-btn{position:fixed;right:16px;bottom:16px;z-index:50;display:none;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:99px;border:0;background:var(--xf1613a);color:var(--x1c1922);font:600 15px Inter,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer}
#cmt-btn.on{background:var(--x6b3e92);color:var(--on-p)}
#cmt-tip{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:50;display:none;background:var(--x26222e);color:var(--xf3f3f3);border:1px solid var(--x4a4256);border-radius:10px;padding:10px 14px;font:14px Inter,system-ui,sans-serif;max-width:calc(100vw - 32px);text-align:center}
.cmt-pick *{cursor:crosshair!important}
.cmt-hover{outline:2px solid var(--xf1613a)!important;outline-offset:2px}
</style>
<button id="cmt-btn" type="button" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Comentar</span></button>
<div id="cmt-tip" role="status">Toque no elemento que quer comentar · Esc cancela</div>
<script>
(function(){
  var btn=document.getElementById('cmt-btn'),tip=document.getElementById('cmt-tip'),on=false,last=null,api=null;
  function set(v){on=v;btn.classList.toggle('on',v);btn.setAttribute('aria-pressed',v);btn.querySelector('span').textContent=v?'Cancelar':'Comentar';tip.style.display=v?'block':'none';document.documentElement.classList.toggle('cmt-pick',v);if(!v&&last){last.classList.remove('cmt-hover');last=null;}}
  btn.addEventListener('click',function(e){e.stopPropagation();set(!on);});
  document.addEventListener('mouseover',function(e){if(!on||btn.contains(e.target))return;if(last)last.classList.remove('cmt-hover');last=e.target;last.classList.add('cmt-hover');},true);
  document.addEventListener('click',function(e){
    if(!on||btn.contains(e.target))return;
    e.preventDefault();e.stopPropagation();
    var el=e.target;set(false);
    api.openComposer({element:el}).then(function(r){if(r&&r.opened===false){tip.textContent='Não foi possível abrir o comentário agora. Tente de novo.';tip.style.display='block';setTimeout(function(){tip.style.display='none';tip.textContent='Toque no elemento que quer comentar · Esc cancela';},2500);}}).catch(function(){});
  },true);
  document.addEventListener('keydown',function(e){if(on&&e.key==='Escape')set(false);});
  if(window.claude&&window.claude.use){window.claude.use('comments').then(function(c){if(c){api=c;btn.style.display='inline-flex';}});}
})();
</script>
</body>
